ServerTokens Prod
ServerSignature Off
TraceEnable Off

Alias /Backend/ /var/www/backend/

<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
    AuthType Basic
    AuthName "AutoControl"
    AuthUserFile /etc/apache2/autocontrol.htpasswd
    Require valid-user
</Directory>

<Directory /var/www/backend>
    Options -Indexes
    AllowOverride None
    AuthType Basic
    AuthName "AutoControl"
    AuthUserFile /etc/apache2/autocontrol.htpasswd
    Require valid-user
</Directory>
